spring.application.name=hubt-assistant-backend

server.port=8080

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/hubt_assistant
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=hubt
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# =========================
# Flyway
# =========================
spring.flyway.enabled=false

# =========================
# JWT
# =========================
app.jwt.secret=HUBT_ASSISTANT_SECRET_KEY_2026_CHANGE_THIS_TO_A_LONG_RANDOM_KEY_123456789
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=2592000000
# =========================
# Password Reset OTP
# =========================

# OTP sống 5 phút
app.auth.password-reset-otp-expiration=300000

# Sau khi OTP đúng, reset token sống 10 phút
app.auth.password-reset-session-expiration=600000

# Nhập sai OTP tối đa 5 lần
app.auth.password-reset-max-attempts=5

# =========================
# Email - Gmail SMTP
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Hỗ trợ trust certificate Gmail
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================
# DevTools
# =========================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =========================
# Swagger
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info

# =========================
# File Storage
# =========================

app.storage.upload-dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB