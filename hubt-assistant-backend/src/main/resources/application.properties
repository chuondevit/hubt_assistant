spring.application.name=hubt-assistant-backend

server.port=8080

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/hubt_assistant
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=hubt
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# =========================
# Flyway
# =========================
spring.flyway.enabled=false

# =========================
# JWT
# =========================
app.jwt.secret=HUBT_ASSISTANT_SECRET_KEY_2026_CHANGE_THIS_TO_A_LONG_RANDOM_KEY_123456789
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=2592000000

# =========================
# Password reset
# =========================
app.auth.password-reset-expiration=900000
app.frontend.reset-password-url=http://localhost:5173/reset-password

# =========================
# Email
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================
# DevTools
# =========================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# =========================
# Swagger
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info